<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vibemix — rebuild north-star · The Deck Speaks</title>
<!--
  REBUILD NORTH-STAR · session surface · 2026-05-26 · iteration 4
  Direction: Hybrid re-composition. Brief: minimal · simple · very unique · 20/80.

  Concept "THE DECK SPEAKS": the whole window is one CDJ-3000 master section at
  rest. No dashboard, no chatbot stack, no panel grid, NO glass card. The
  co-host's latest line floats on the window void, anchored low like a mixer
  LCD; prior lines recede upward as ghost type (memory, not a chat log). One
  master meter + BPM/key sit at the foot behind a single hairline.

  THE SIGNATURE GESTURE: when a reaction arrives the line RISES in silk; a 1px
  amber hairline then DRAWS left-to-right beneath it, terminating at the
  grounding cite, which IGNITES (spark then settle) as the rule reaches it. The
  sentence underlines its own claim with its own evidence — "it spoke, then
  drew its receipt." The one piece of amber choreography; the anti-slop thesis
  made visible. In the port this re-fires per reaction (JS-retriggered).

  ITERATION 4 changes (acted on critique #3, 27/40):
   · [P2 slop] CUT the five --rave-* aurora washes. Pure CDJ void (vignette +
     deep linear base + film grain) — both reviews flagged the 0.02-0.05 hedge
     as the only slop-adjacent decision. PROPOSES a tokens.css body-bg change.
   · [P1 timing] Receipt ignite delay 820 → 900ms = exactly when the rule
     finishes its travel (360 draw-delay + 520 draw). Ignition now reads as the
     consequence of arrival, not a coincidence.
   · [P1 states] Split silent vs failure: data-mode="silent" = calm listening
     (quiet room); data-mode="fault" = a dropped input — the offending status
     badge flips to down (the previously-dead [data-state="down"] styling) and
     the liveness label states the cause. Toggle cycles live → silent → fault.
   · [resting life] The master meter now genuinely TWITCHES with simulated
     audio (rAF, mock-only) so the resting screen breathes via real telemetry,
     not a fake heartbeat. Holds still in silent/fault.
   · [P3] Liveness label cross-fades between states (no hard text-pop); three
     stacked labels share one 700ms settle.
   · [P2 agency] Persona is now a visible, glanceable tap-to-cycle control
     (hype → teach → coach), not hover-buried; secondary mute stays on hover.

  Locked PORT TARGET for SessionLayout.ts. Tokens mirror tokens.css (subset).
-->
<style>
:root{
  --void:#000;--void-1:#020205;--void-2:#05070b;--void-3:#0a0c12;--void-4:#11141c;
  --glass-1:rgba(8,10,16,.78);--glass-2:rgba(12,14,22,.62);--glass-3:rgba(2,3,6,.88);
  --glass-edge:rgba(255,255,255,.065);--glass-edge-up:rgba(255,255,255,.110);--glass-top:rgba(255,255,255,.055);
  --silk:#d6cfc7;--silk-65:rgba(214,207,199,.65);--silk-40:rgba(214,207,199,.40);--silk-22:rgba(214,207,199,.22);--silk-12:rgba(214,207,199,.12);
  --amber:#ff8a3d;--amber-deep:#ff5a1a;--amber-pale:#ffb88a;--amber-22:rgba(255,138,61,.22);--amber-40:rgba(255,138,61,.40);--amber-65:rgba(255,138,61,.65);--amber-78:rgba(255,138,61,.78);
  --led-fault:#d4413a;
  --blur-glass-light:blur(16px) saturate(120%);
  --glow-soft:0 0 6px var(--amber-40),0 0 14px var(--amber-22);
  --type-display:'Saira',system-ui,sans-serif;--type-body:'Saira',system-ui,sans-serif;--type-mono:'JetBrains Mono',ui-monospace,monospace;
  --rad-sm:2px;--rad-md:6px;--rad-lg:10px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:40px;--sp-7:64px;--sp-8:96px;
  --titlebar-h:56px;--statusbar-h:40px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--silk);font-family:var(--type-body);font-weight:400;font-variation-settings:"wdth" 100,"wght" 400;font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
/* pure CDJ void — vignette + deep linear base; no aurora washes [P2 slop cut] */
body{background-color:var(--void);
  background-image:
    radial-gradient(ellipse 92% 78% at 50% 42%,transparent 0%,rgba(0,0,0,.55) 72%,rgba(0,0,0,.92) 100%),
    linear-gradient(180deg,#04050b 0%,#000 52%,#030206 100%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='d'><feTurbulence type='fractalNoise' baseFrequency='0.42' numOctaves='3' seed='9'/></filter><rect width='100%25' height='100%25' filter='url(%23d)' opacity='0.022'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='280'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='2' seed='5'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.028'/></svg>");
  mix-blend-mode:overlay}

.app{display:grid;grid-template-rows:var(--titlebar-h) 1fr var(--statusbar-h);height:100vh;position:relative}
.titlebar{display:flex;align-items:center;justify-content:space-between;padding:0 var(--sp-5);background:rgba(0,0,0,.55);backdrop-filter:var(--blur-glass-light);border-bottom:1px solid var(--glass-edge);user-select:none}
.titlebar .spacer{width:72px}
.titlebar .wordmark{font-family:var(--type-display);font-variation-settings:"wdth" 85,"wght" 700;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.titlebar .clock{font-family:var(--type-mono);font-size:11px;color:var(--silk-40);letter-spacing:.08em}

.stage{display:grid;place-items:stretch;min-height:0;position:relative}
.deck{position:relative;display:grid;grid-template-rows:auto 1fr auto;min-height:0;padding:0 clamp(24px,6vw,96px)}

/* --- top rail: persona toggle · liveness label --- */
.rail{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-5) 0 var(--sp-4);border-bottom:1px solid var(--glass-edge)}
.persona{display:flex;align-items:baseline;gap:var(--sp-3);border:0;background:none;cursor:pointer;transition:opacity 150ms ease-out}
.persona:hover{opacity:.8}
.persona .k{font-family:var(--type-display);font-variation-settings:"wdth" 85,"wght" 600;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--silk-22)}
.persona .v{font-family:var(--type-display);font-variation-settings:"wdth" 85,"wght" 700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--silk-65)}
.persona:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:var(--rad-sm)}
/* persistent low-ink at rest (reachable mid-set), full on hover/focus.
 * Real app also binds these to keyboard shortcuts (session-shortcuts.ts). */
.controls{display:flex;gap:var(--sp-2);opacity:.32;transition:opacity 180ms ease-out}
.deck:hover .controls,.deck:focus-within .controls{opacity:1}
.controls button{font-family:var(--type-display);font-variation-settings:"wdth" 85,"wght" 600;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--silk-40);border:1px solid var(--glass-edge);border-radius:var(--rad-sm);padding:5px 12px;background:rgba(2,3,6,.4)}
.controls button:hover{color:var(--silk);border-color:var(--glass-edge-up)}
.live{position:relative;min-width:150px;height:1.2em;text-align:right}
.live .s{position:absolute;right:0;top:0;white-space:nowrap;opacity:0;transition:opacity 700ms ease-out;font-family:var(--type-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.live .s-live{color:var(--silk-40)}
.live .s-silent{color:var(--silk-22)}
.live .s-fault{color:var(--amber-pale)}
.app:not([data-mode]) .live .s-live,.app[data-mode=""] .live .s-live{opacity:1}
.app[data-mode="silent"] .live .s-silent{opacity:1}
.app[data-mode="fault"] .live .s-fault{opacity:1}

/* --- THE HERO: speaks, anchored low on void --- */
.speak{display:flex;flex-direction:column;justify-content:flex-end;gap:var(--sp-3);min-height:0;padding:var(--sp-7) 0 var(--sp-6)}
.ghost{font-family:var(--type-body);font-variation-settings:"wdth" 100,"wght" 400;font-size:15px;line-height:1.4;transition:color 700ms ease-out}
.ghost.g2{color:var(--silk-12)}
.ghost.g1{color:var(--silk-22)}
.claim{display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-3);margin-top:var(--sp-2)}
.now{font-family:var(--type-display);font-variation-settings:"wdth" 92,"wght" 600;font-size:clamp(30px,3.6vw,48px);line-height:1.04;letter-spacing:.003em;color:var(--silk);text-wrap:balance;max-width:22ch;transition:color 700ms ease-out;animation:rise 400ms cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* THE RECEIPT — underline draws L→R, cite ignites at its terminus [signature] */
.receipt{display:flex;align-items:center;gap:var(--sp-3);width:min(22ch,100%);max-width:520px;transition:opacity 700ms ease-out}
.receipt .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--amber-40),var(--amber));transform:scaleX(0);transform-origin:left;animation:draw 520ms cubic-bezier(.22,1,.36,1) 360ms forwards}
.cite{flex:none;display:inline-flex;align-items:center;gap:6px;font-family:var(--type-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber-pale);border:1px solid var(--amber-22);border-radius:var(--rad-sm);padding:3px 8px;background:rgba(255,138,61,.04);cursor:pointer;text-shadow:0 0 6px var(--amber-22);animation:ignite 380ms cubic-bezier(.16,1,.3,1) 900ms both}
.cite:hover{border-color:var(--amber-40);background:rgba(255,138,61,.09)}
@keyframes draw{to{transform:scaleX(1)}}
@keyframes ignite{0%{opacity:0;color:var(--silk-40);border-color:var(--glass-edge);background:transparent;text-shadow:none;box-shadow:none}
  55%{opacity:1;color:var(--amber);border-color:var(--amber-65);background:rgba(255,138,61,.10);text-shadow:0 0 8px var(--amber-65);box-shadow:var(--glow-soft)}
  100%{opacity:1;color:var(--amber-pale);border-color:var(--amber-22);background:rgba(255,138,61,.04);text-shadow:0 0 6px var(--amber-22);box-shadow:none}}

/* --- FOOT: one steady master readout (BPM · key · live level) --- */
.foot{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:clamp(24px,4vw,64px);padding:var(--sp-4) 0 var(--sp-5);border-top:1px solid var(--glass-edge)}
.read{display:flex;align-items:baseline;gap:var(--sp-2)}
.read .lab{font-family:var(--type-display);font-variation-settings:"wdth" 85,"wght" 600;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--silk-22)}
.read .num{font-family:var(--type-mono);font-weight:500;font-size:22px;letter-spacing:.02em;color:var(--silk);transition:color 700ms ease-out}
.read .key{font-family:var(--type-mono);font-weight:500;font-size:18px;color:var(--amber-pale);letter-spacing:.04em;transition:color 700ms ease-out}
.meter{position:relative;height:12px;border-radius:var(--rad-sm);background:var(--void-1);border:1px solid var(--glass-edge);box-shadow:inset 0 0 6px rgba(0,0,0,.7);overflow:hidden}
.meter .fill{position:absolute;inset:1px;width:60%;border-radius:1px;background:linear-gradient(90deg,var(--amber-40),var(--amber-78) 80%,var(--amber));transition:background 700ms ease-out}
.meter .peak{position:absolute;top:1px;bottom:1px;left:74%;width:2px;background:var(--amber-pale);transition:opacity 700ms ease-out}

/* === status bar — silk-dim when fine; lights only on a dropped input === */
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:0 var(--sp-5);background:rgba(0,0,0,.55);backdrop-filter:var(--blur-glass-light);border-top:1px solid var(--glass-edge)}
/* one quiet input-health voice (folded the 3-dot row in) — a dropped input
 * lights red, the one allowed non-amber accent [P3 last slop element cut] */
.statusbar .left{display:flex;align-items:center;font-family:var(--type-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--silk-22)}
.statusbar .i{transition:color 700ms ease-out,text-shadow 700ms ease-out}
.statusbar .sep{color:var(--silk-12);margin:0 8px}
.app[data-mode="fault"] .i-audio{color:var(--led-fault);text-shadow:0 0 6px rgba(212,65,58,.5)}
.statusbar .right{font-family:var(--type-mono);font-size:11px;color:var(--silk-40);letter-spacing:.08em}

/* === SILENT + FAULT — the surface settles into listening / holds on a drop = */
.app[data-mode="silent"] .now,.app[data-mode="fault"] .now{color:var(--silk-40)}
.app[data-mode="silent"] .receipt,.app[data-mode="fault"] .receipt{opacity:0;pointer-events:none}
.app[data-mode="silent"] .foot .num,.app[data-mode="silent"] .foot .key,
.app[data-mode="fault"] .foot .num,.app[data-mode="fault"] .foot .key{color:var(--silk-40)}
/* silent = calm idle breath (still powered); fault = dead-flat (stopped) [P2] */
.app[data-mode="silent"] .meter .fill{background:var(--silk-22);animation:idlebreath 3200ms ease-in-out infinite}
.app[data-mode="fault"] .meter .fill{background:var(--silk-12);animation:none}
.app[data-mode="silent"] .meter .peak,.app[data-mode="fault"] .meter .peak{opacity:0}
@keyframes idlebreath{0%,100%{opacity:.4}50%{opacity:.85}}

.devtoggle{position:fixed;left:12px;bottom:48px;z-index:10000;font-family:var(--type-mono);font-size:10px;letter-spacing:.1em;color:var(--silk-40);background:rgba(2,3,6,.7);border:1px solid var(--glass-edge);border-radius:var(--rad-sm);padding:5px 10px;cursor:pointer}

@media (prefers-reduced-motion:reduce){.now,.cite{animation:none}.receipt .rule{animation:none;transform:scaleX(1)}}
</style>
</head>
<body>
<div class="app" id="app" data-mode="">

  <header class="titlebar">
    <div class="spacer"></div>
    <div class="wordmark">vibemix</div>
    <div class="clock">01:24:07</div>
  </header>

  <main class="stage">
    <section class="deck" tabindex="0" aria-label="co-host">
      <div class="rail">
        <button class="persona" type="button" id="persona" aria-label="co-host mood: hype. tap to cycle hype, teach, coach.">
          <span class="k">persona</span><span class="v" id="persona-v">hype</span>
        </button>
        <div class="controls"><button type="button">mute 60s</button></div>
        <div class="live">
          <span class="s s-live">reading the room</span>
          <span class="s s-silent">listening</span>
          <span class="s s-fault">◂ audio input dropped</span>
        </div>
      </div>

      <div class="speak">
        <p class="ghost g2">there it is, the kick's back in</p>
        <p class="ghost g1">crowd's locked, hold this groove</p>
        <div class="claim">
          <p class="now">that breakdown is landing exactly where it should</p>
          <div class="receipt"><span class="rule"></span><span class="cite">◂ phase @ 01:23:51</span></div>
        </div>
      </div>

      <div class="foot">
        <div class="read"><span class="lab">bpm</span><span class="num">128.0</span></div>
        <div class="read"><span class="lab">key</span><span class="key">8A</span></div>
        <div class="meter" aria-label="master level"><div class="fill"></div><div class="peak"></div></div>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <div class="left"><span class="i i-audio">audio</span><span class="sep">·</span><span class="i">screen</span><span class="sep">·</span><span class="i">midi</span></div>
    <div class="right">DDJ-FLX4 · 48.0k</div>
  </footer>
</div>

<button class="devtoggle" id="devtoggle">state: live (tap → silent → fault)</button>

<script>
  // mock-only: cycle states + simulate live master level so the resting
  // screen breathes via real telemetry (NOT a fake heartbeat).
  var app=document.getElementById('app');
  var dt=document.getElementById('devtoggle');
  var labels={'':'state: live (tap → silent → fault)','silent':'state: silent (tap → fault)','fault':'state: fault (tap → live)'};
  dt.onclick=function(){var m=app.dataset.mode||'';app.dataset.mode=m===''?'silent':(m==='silent'?'fault':'');dt.textContent=labels[app.dataset.mode||''];};

  var fill=document.querySelector('.meter .fill'),peak=document.querySelector('.meter .peak');
  var cur=60,tgt=60,pk=74,last=0;
  function loop(t){
    if(!(app.dataset.mode||'')){
      if(t-last>140){tgt=44+Math.random()*28;last=t;}
      cur+=(tgt-cur)*0.16;
      if(cur+4>pk)pk=cur+4; else pk+=(cur+4-pk)*0.04;
      fill.style.width=cur.toFixed(1)+'%';
      peak.style.left=Math.min(pk,86).toFixed(1)+'%';
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // persona tap-to-cycle (glanceable agency, not hover-buried)
  var moods=['hype','teach','coach'],pv=document.getElementById('persona-v');
  document.getElementById('persona').onclick=function(){var i=(moods.indexOf(pv.textContent)+1)%3;pv.textContent=moods[i];};
</script>
</body>
</html>
