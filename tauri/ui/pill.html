<!DOCTYPE html>
<html lang="en" style="background: transparent; margin: 0; padding: 0;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>vibemix pill</title>
    <!--
      Phase 62 Plan 04 — floating-pill overlay webview entry.

      This is the THIRD Tauri overlay webview (after mascot_window + debrief),
      loaded into the "pill" window built by pill_window::create_pill_window
      (Plan 62-01/02). The window itself is `transparent: true` +
      `always_on_top: true` + `decorations: false` + non-activating per the
      62-UI-SPEC §Window/Tauri Contract.

      TRANSPARENT-OVERLAY INVARIANT (cloned from the shipped overlay entries —
      NOT referenced by name in any test surface so the mascot-audit fence
      stays green): tokens.css applies a v5 cinematic body background (radial
      vignette + film-grain SVG via body::before) at :root scope. That would
      opaque-out the always-on-top pill window. We force html/body transparent
      !important and disable body::before so the Tauri transparent flag
      composites the pill's own --glass-3 rgba surface straight over the
      desktop. The !important is justified — the overlay MUST composite over
      the desktop (62-UI-SPEC §Color / RESEARCH Pitfall 4).

      The VISIBLE surface is painted by CSS `--glass-3` = rgba(2,3,6,0.88)
      (62-UI-SPEC §Color), NOT OS vibrancy — guarantees mac+win parity +
      dodges the DMG white-box regression (tauri#13415). backdrop-filter is a
      progressive enhancement layered ON TOP, never the sole opacity source.
      (The explicit rgba glass surface + deck-context chips land in Plan 62-05;
      this scaffold lays out the structure + the core idle/listening/speaking/
      expand surface.)

      Hard rules honoured (frontend-enforcement skill):
        - tokens-only CSS (var(--*)), Saira + JetBrains Mono only, single amber
          accent reserved to the state dot / waveform / citation chips.
        - No external CDNs, no inline scripts beyond the module import.
        - Transparent root chain so the pill is a free-floating lozenge.
    -->
    <link rel="stylesheet" href="/src/tokens.css" />
    <!-- Pill chrome + the explicit --glass-3 rgba transparency-parity surface
         live in the canonical token-only stylesheet (62-05). The inline <style>
         below carries ONLY the transparent-overlay invariant (which MUST sit
         inline so it loads before the pill paints + can't be split into a
         component stylesheet). -->
    <link rel="stylesheet" href="/src/pill/pill.css" />
    <style>
      /* ── Transparent-overlay invariant override (MUST stay inline) ───────
       * Survive the tokens.css v5 vignette + kill the film-grain SVG layer so
       * the pill composites over the desktop. The pill's OWN surface is the
       * explicit --glass-3 rgba fill in pill.css — this block only keeps the
       * html/body chain transparent so that fill composites over the desktop
       * (the rgba is on .pill, NEVER on body). */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent !important;
        background-image: none !important;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }
      body::before {
        display: none !important;
      }
    </style>
  </head>
  <body style="background: transparent; margin: 0; padding: 0; overflow: hidden;">
    <div
      class="pill"
      id="pill"
      data-state="idle"
      data-open="false"
      data-wire="pill.shell"
      tabindex="0"
      role="group"
      aria-label="vibemix cohost pill"
    >
      <!-- Top rail = drag strip. It overlays the compact face so the pill does
           not waste vertical space on a blank forehead. -->
      <div class="pill__drag" id="pill-drag" data-wire="pill.drag" aria-hidden="true">
        <div class="pill__grab"></div>
      </div>
      <!-- Collapsed face: state dot + state label + grade + waveform mount. -->
      <div class="pill__row" data-wire="pill.row">
        <div class="pill__dot" id="pill-dot" data-wire="pill.intelligence" aria-hidden="true"></div>
        <!-- a11y: the dot + waveform are aria-hidden decoration, so the dynamic
             state caption is the ONLY screen-reader signal of IDLE→LISTENING→
             SPEAKING. role=status + aria-live=polite announces the co-host
             starting/stopping without interrupting (UI-REVIEW minor a11y rec). -->
        <div class="pill__label" id="pill-label" data-wire="pill.state-label" role="status" aria-live="polite">IDLE</div>
        <div class="pill__grade" id="pill-grade" data-wire="pill.grade" aria-live="polite"></div>
        <span class="pill__level" id="pill-level" data-wire="pill.level" aria-live="polite"></span>
        <div class="pill__wave" id="pill-wave" data-wire="pill.wave"></div>
      </div>
      <div class="pill__burst" id="pill-burst" data-wire="pill.burst" aria-hidden="true"></div>
      <div class="pill__overdrive" id="pill-overdrive" data-wire="pill.overdrive" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <span class="pill__streak" id="pill-streak" data-wire="pill.streak" aria-hidden="true"></span>
      <span class="pill__notch" data-wire="pill.notch" aria-hidden="true"></span>
      <!-- Expand panel: reaction text + citation strip mount (62-04);
           deck-context chips mount (62-05). -->
      <div class="pill__expand" id="pill-expand" data-wire="pill.expand">
        <canvas class="pill__fx" id="pill-fx" aria-hidden="true"></canvas>
        <div
          class="pill__reaction"
          id="pill-reaction"
          data-wire="pill.reaction"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></div>
        <div class="pill__decks" id="pill-decks" data-wire="pill.decks"></div>
      </div>
      <!-- Collapsed-hover PEEK card mount (Phase-1b). The next-track suggestion
           surfaces here on pointer-hover of the COLLAPSED pill, as a small
           floating card below the row — NOT the full expand panel. Hidden at
           rest; revealed under .pill[data-peek="true"] (CSS). Honest silence:
           index.ts renders NOTHING here when there is no grounded suggestion.
           [data-no-drag] so hovering the card never starts a window drag. -->
      <div class="pill__peek" id="pill-peek" data-wire="pill.peek" data-no-drag aria-live="polite"></div>
    </div>
    <script type="module" src="/src/pill/index.ts"></script>
  </body>
</html>
