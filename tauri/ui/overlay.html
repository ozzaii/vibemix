<!DOCTYPE html>
<html lang="en" style="background: transparent; margin: 0; padding: 0;">
  <head>
    <meta charset="UTF-8" />
    <title>vibemix overlay</title>
    <!--
      Phase 24 Plan 02 — overlay-highlight webview entry.

      Opened by `tauri/src-tauri/src/overlay.rs::show_overlay_highlight`
      as a per-element WebviewWindow (label = "overlay-<element_id>"):
        - transparent: true  (no opaque background; just the ring)
        - always_on_top: true
        - decorations: false
        - skip_taskbar: true
        - visible_on_all_workspaces: true
        - set_ignore_cursor_events(true) AFTER build (click-through)

      The Rust side passes color + duration_ms as URL query params:
        overlay.html?color=amber&duration_ms=1300

      Ring lifecycle (CDJ Whisper v5 amber):
        fade-in 200ms → hold 800ms → fade-out 300ms == 1300ms total.

      The window is closed after duration_ms by a Tokio task in
      overlay.rs — no inline JS timer needed; the CSS animation runs
      once and the OS window closes underneath it.
    -->
    <!-- VIS-02 (43-02): tokens.css linked so the ring colour resolves
         from the CDJ-Whisper palette (--amber + LED palette) at runtime.
         Previously the overlay window inlined #f59e0b as a fallback —
         that was a non-token literal AND the wrong amber (mocks use
         #ff8a3d). overlay-runtime.ts now reads tokens via
         getComputedStyle(documentElement) and writes a var() reference
         to --ring-color when the resolved string isn't available. -->
    <link rel="stylesheet" href="/src/tokens.css" />
    <style>
      /* VIS-02 (43-02) — Phase 24 transparent-overlay invariant override.
         tokens.css ships a v5 cinematic body background + body::before
         film-grain that would opaque-out the desktop composition path.
         The mascot overlay window uses the same override pattern; mirror
         it here so the click-feedback ring still composites onto the
         desktop instead of a dark vignette. */
      html, body {
        background: transparent !important;
        background-image: none !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* The Rust side already calls set_ignore_cursor_events(true) on
           the WebviewWindow; pointer-events: none here is belt-and-braces
           for the rare case where a corner click hits the webview before
           the click-through flag propagates. */
        pointer-events: none;
      }
      body::before { display: none !important; }
      /* VIS-02 (43-02) — ring fallback now references the --amber token
         (resolved by tokens.css) instead of an inline #f59e0b literal.
         overlay-runtime.ts overrides --ring-color at boot with the
         resolved colour or var() reference; this rule is the no-JS
         safety net. */
      .ring {
        position: absolute;
        inset: 6px;
        color: var(--ring-color, var(--amber));
        border-radius: 18px;
        opacity: 0;
        transform: scale(0.985);
        filter: drop-shadow(0 0 6px currentColor);
        animation: focus-aperture var(--ring-duration, 1300ms) cubic-bezier(0.22, 1, 0.36, 1) 1 forwards;
      }
      .ring::before,
      .ring::after {
        content: "";
        position: absolute;
        pointer-events: none;
      }
      .ring::before {
        inset: 8px;
        border: 1px solid currentColor;
        border-radius: 13px;
        opacity: 0.12;
        box-shadow:
          inset 0 0 18px currentColor,
          0 0 18px currentColor;
      }
      .ring::after {
        inset: 0;
        border-radius: inherit;
        box-shadow:
          inset 0 1px 0 rgba(255, 251, 244, 0.26),
          inset 0 -1px 0 rgba(0, 0, 0, 0.46);
        opacity: 0.72;
      }
      .corner {
        position: absolute;
        width: 52px;
        height: 52px;
      }
      .corner::before,
      .corner::after {
        content: "";
        position: absolute;
        background: currentColor;
        box-shadow:
          0 0 8px currentColor,
          inset 0 1px 0 rgba(255, 251, 244, 0.34);
      }
      .corner::before {
        width: 44px;
        height: 2px;
      }
      .corner::after {
        width: 2px;
        height: 44px;
      }
      .corner--tl { left: 0; top: 0; }
      .corner--tl::before,
      .corner--tl::after { left: 0; top: 0; }
      .corner--tr { right: 0; top: 0; }
      .corner--tr::before,
      .corner--tr::after { right: 0; top: 0; }
      .corner--bl { left: 0; bottom: 0; }
      .corner--bl::before,
      .corner--bl::after { left: 0; bottom: 0; }
      .corner--br { right: 0; bottom: 0; }
      .corner--br::before,
      .corner--br::after { right: 0; bottom: 0; }
      .scan,
      .rail,
      .bead {
        position: absolute;
        pointer-events: none;
      }
      .scan {
        opacity: 0.34;
        background: currentColor;
        box-shadow: 0 0 10px currentColor;
      }
      .scan--x {
        left: 18px;
        right: 18px;
        top: 50%;
        height: 1px;
        transform: translateY(-18px);
        mask-image: linear-gradient(90deg, transparent, black 18%, black 82%, transparent);
        animation: aperture-scan-x var(--ring-duration, 1300ms) cubic-bezier(0.22, 1, 0.36, 1) 1 forwards;
      }
      .scan--y {
        top: 18px;
        bottom: 18px;
        left: 50%;
        width: 1px;
        transform: translateX(16px);
        opacity: 0.18;
        mask-image: linear-gradient(180deg, transparent, black 18%, black 82%, transparent);
        animation: aperture-scan-y var(--ring-duration, 1300ms) cubic-bezier(0.22, 1, 0.36, 1) 1 forwards;
      }
      .rail {
        left: 68px;
        right: 68px;
        height: 10px;
        background:
          repeating-linear-gradient(90deg, currentColor 0 1px, transparent 1px 12px);
        mask-image: linear-gradient(90deg, transparent, black 18%, black 82%, transparent);
        opacity: 0.34;
      }
      .rail--top { top: 1px; }
      .rail--bottom { bottom: 1px; }
      .bead {
        width: 6px;
        height: 6px;
        border-radius: 1px;
        background: currentColor;
        box-shadow:
          0 0 9px currentColor,
          inset 0 1px 0 rgba(255, 251, 244, 0.42);
      }
      .bead--lead {
        top: 0;
        left: 50%;
        transform: translateX(-50%);
      }
      .bead--tail {
        right: 0;
        top: 50%;
        opacity: 0.56;
        transform: translateY(-50%);
      }
      @keyframes focus-aperture {
        0%   { opacity: 0; transform: scale(0.985); }
        14%  { opacity: 1; transform: scale(1); }
        76%  { opacity: 0.94; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.012); }
      }
      @keyframes aperture-scan-x {
        0%   { transform: translateY(-18px); opacity: 0; }
        18%  { opacity: 0.34; }
        74%  { opacity: 0.30; }
        100% { transform: translateY(18px); opacity: 0; }
      }
      @keyframes aperture-scan-y {
        0%   { transform: translateX(16px); opacity: 0; }
        18%  { opacity: 0.18; }
        74%  { opacity: 0.16; }
        100% { transform: translateX(-16px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ring {
          animation-name: focus-aperture;
        }
        .scan--x,
        .scan--y {
          animation: none;
          transform: none;
          opacity: 0.16;
        }
      }
    </style>
  </head>
  <body data-wire="overlay.shell">
    <div class="ring" id="ring" data-wire="overlay.ring" aria-hidden="true">
      <span class="corner corner--tl" data-wire="overlay.corner.tl"></span>
      <span class="corner corner--tr" data-wire="overlay.corner.tr"></span>
      <span class="corner corner--bl" data-wire="overlay.corner.bl"></span>
      <span class="corner corner--br" data-wire="overlay.corner.br"></span>
      <span class="scan scan--x" data-wire="overlay.scan-x"></span>
      <span class="scan scan--y" data-wire="overlay.scan-y"></span>
      <span class="rail rail--top"></span>
      <span class="rail rail--bottom"></span>
      <span class="bead bead--lead"></span>
      <span class="bead bead--tail"></span>
    </div>
    <script type="module" src="/src/overlay/overlay-runtime.ts"></script>
  </body>
</html>
