[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibemix"
version = "0.1.0-dev0"
description = "Open-source AI DJ co-host. Listens, watches, talks back."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Kaan Özkan", email = "oozzxaaii@gmail.com" },
]
keywords = ["dj", "ai", "audio", "midi", "live-performance", "gemini", "livekit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Artistic Software",
]
dependencies = [
    "google-genai>=2.0.1",
    "httpx>=0.28",
    "keyring>=25.7.0",
    "livekit-agents>=1.5.14",
    "livekit-plugins-google>=1.5.14",
    "livekit-plugins-openai>=1.5.14",
    "livekit>=1.1.8",
    "numpy>=2.4.4",
    # Direct runtime dependency: local CLAP/CUE decode and debrief MP3 encode
    # import PyAV directly. Do not rely on LiveKit Agents to pull it transitively.
    "av>=17.0.1",
    "sounddevice>=0.5.5",
    "mido>=1.3.3",
    "python-rtmidi>=1.5.8",
    # Phase 92 Plan 92-01 (LESSON-02 / LESSON-06): python-statemachine is the
    # lesson runtime engine. MIT-licensed, pure-Python (~30 KB), no transitive
    # deps, no native code. PyPI provenance since 2015 (slopcheck OK per
    # 92-RESEARCH.md §Package Legitimacy Audit). One-click-install-safe.
    "python-statemachine>=3.1.2,<4.0",
    # Phase 25 Plan 25-01: pyrekordbox==0.4.4 is the Rekordbox collection.xml
    # parser (XML import path only — SQLCipher path explicitly UNUSED in v2.0
    # per CONTEXT D-01 + LIBRARY-07). pyrekordbox's setup.py hard-pulls
    # sqlcipher3-wheels (3.2 MB binary blob) as an install_requires entry;
    # WAVE-0-DEPS-SPIKE.md verdict locks the --no-deps install path with
    # manual transitives co-declared below. The C-extension load in
    # pyrekordbox.db6.database is guarded by a try/except (database.py:28-34)
    # so the package imports cleanly under the stdlib-sqlite3 fallback.
    #
    # INSTALL RECIPE (encoded as `[tool.uv.sources]` override below — uv
    # respects `--no-deps` semantics by skipping pyrekordbox's metadata
    # install_requires when the source override declares no transitives;
    # vibemix declares the required transitives explicitly):
    "pyrekordbox==0.4.4",
    # pyrekordbox transitive — bidirectional dict for rbxml tag/attr maps
    "bidict==0.23.1",
    # pyrekordbox transitive — ANLZ binary parser (used by .anlz; lazily by .db6)
    "construct==2.10.70",
    # pyrekordbox transitive — required by .db6.database import chain even when
    # SQLCipher dormant (we never call Rekordbox6Database.unlock() in v2.0)
    "SQLAlchemy==2.0.49",
    # pyrekordbox transitive — Rekordbox process discovery in .config
    "psutil==7.2.2",
    # pyrekordbox transitive — date parsing in mysettings + rbxml
    "python-dateutil==2.9.0.post0",
    # NOTE: numpy / packaging / typing_extensions / six are also pyrekordbox
    # transitives but already supplied by existing vibemix deps (numpy>=2.4.4
    # explicit; the rest pulled transitively by SQLAlchemy / python-dateutil).
    # SQLCipher BUNDLE EXCLUSION: sqlcipher3-wheels is intentionally NOT
    # declared anywhere in this file — PyInstaller bundle gate (Phase 21)
    # verifies the binary never lands in dist/. See tests/library/
    # test_pyrekordbox_install.py for the sys.modules dormancy gate.
    #
    # sqlite-vec — SHIPPED and exercised (library vibe-search v2.1; memory
    # store v6.0). Historical note: it began as a v2.0 architectural slot
    # (LIBRARY-08 + CONTEXT D-08, text-match only) with the dep deliberately
    # omitted to stay under the bundle cap; that reservation was realised in
    # v2.1+ and sqlite-vec is now a declared runtime dependency. (Corrected
    # v8.0 P73 — the old "NOT exercised / ships v2.1" wording was doc-drift.)
    # Phase 8: mss is win32-only now. macOS uses ScreenCaptureKit (pyobjc-
    # framework-ScreenCaptureKit, added below); the deprecated
    # ``CGWindowListCreateImageFromArray`` path that mss wraps is obsolete
    # in macOS 15+. ScreenWindows still uses mss on Windows.
    "mss>=10.2.0 ; sys_platform == 'win32'",
    "pillow>=12.2.0",
    "pyjwt>=2.12.1",
    # Phase 11 Wave 0: jsonschema validates ipc.* messages at the Python↔TS
    # boundary against ``tauri/ui/src/ipc/messages.schema.json`` (Draft-07).
    # Validation-only — no model gen (Phase 6 convention bans pydantic).
    "jsonschema>=4.23,<5",
    "websockets>=13.0",
    # Event-driven library/catalog freshness pulse; staleness.py degrades to
    # bounded polling if the native watcher is unavailable in a frozen build.
    "watchfiles>=1.1.1",
    "python-dotenv>=1.2.2",
    "pyobjc-core>=12.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=12.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=12.1 ; sys_platform == 'darwin'",
    # Phase 8 Wave 1: ScreenCaptureKit replaces the deprecated
    # ``CGWindowListCreateImageFromArray`` capture path on macOS 12.3+.
    # pyobjc-framework-ScreenCaptureKit ships at the same 12.1 version
    # baseline as the rest of the pyobjc family (verified on PyPI 2026-05).
    "pyobjc-framework-ScreenCaptureKit>=12.1 ; sys_platform == 'darwin'",
    # Phase 11 Wave 4: AVFoundation is required for the calibration wizard's
    # microphone-permission probe (AVCaptureDevice.authorizationStatusForMediaType_
    # + AVCaptureDevice.requestAccessForMediaType_completionHandler_). Same 12.1
    # baseline as the rest of the pyobjc family.
    "pyobjc-framework-AVFoundation>=12.1 ; sys_platform == 'darwin'",
    # Phase 7 Wave 1: Windows-only deps. PyAudioWPatch is the maintained
    # WASAPI-loopback PyAudio fork (Wave 2). pywin32 powers EnumWindows /
    # SMTC FFI (Wave 3). winsdk is Microsoft's official Python winrt
    # bindings (replaces deprecated `winrt`) for SMTC reads (Wave 3).
    # All three are gated on win32 → uv sync skips them on macOS; PyInstaller
    # picks them up automatically on Windows.
    "pyaudiowpatch>=0.2.12 ; sys_platform == 'win32'",
    "pywin32>=308 ; sys_platform == 'win32'",
    # winsdk ships only beta releases on PyPI as of 2026-05 (latest 1.0.0b10).
    # Pin to >=1.0.0b10 so resolver accepts the published beta; production
    # tracks the latest beta until Microsoft graduates to 1.0.0.
    "winsdk>=1.0.0b10 ; sys_platform == 'win32'",
    "sqlite-vec>=0.1.9",
    # Viber Agent — Codex backend. The MCP SDK (FastMCP) exposes the 3 grounded
    # library tools (search_vibe / get_track_features / create_playlist) over
    # STDIO to the native Codex CLI (`codex exec`, provider: openai-codex — the
    # Hermes pattern). Pure-Python, no native build → green on the one-click-
    # install bar. Only the OPTIONAL playlist-curation agent needs it; the live
    # co-host never imports it.
    "mcp>=1.2.0",
]

[project.optional-dependencies]
# Phase 90+ — local AI extras. The app/installer path should install
# `ai-local`; narrow extras let CI/import-only jobs avoid heavy deps.
#
# Shared deps:
# - onnxruntime: cross-platform ONNX inference (~13-18MB wheel, no torch).
# - tokenizers: CLAP Roberta tokenizer without the full Transformers package.
# Audio decode/DSP for CLAP/CUE uses PyAV/FFmpeg plus narrow numpy helpers,
# avoiding scipy and librosa's numba/llvmlite/scikit-learn dependency family.
#
# All are lazy-imported so `import vibemix.library.*` stays safe without them.
# Verified torch-free: genre parity holds (techno 10/10, psy 10/10) with torch
# absent. CUE-DETR preprocessing is local numpy code, so Transformers is not in
# the one-click local model dependency set.
clap = [
    "onnxruntime>=1.20",
    "tokenizers>=0.22",
]
cue = [
    "onnxruntime>=1.20",
]
# Local on-device TTS (the free co-host voice) — vendored MOSS-TTS-Nano ONNX.
# sentencepiece is the text tokenizer (standalone C++, torch-free); onnxruntime
# runs the engine. Verified torch-free: the vendored runtime imports only stdlib
# + numpy + onnxruntime (see vibemix/agent/moss_tts/). Weights are cached at
# runtime under ~/.cache/vibemix/moss-tts-onnx/, not shipped in the wheel.
tts-local = [
    "onnxruntime>=1.20",
    "sentencepiece>=0.2",
]
ai-local = [
    "onnxruntime>=1.20",
    "tokenizers>=0.22",
    "sentencepiece>=0.2",
]
telegram = [
    "python-telegram-bot>=21",
]
# Serato file-tag cue export. mutagen writes the ID3 container in this first
# slice; FLAC/MP4 carriers remain follow-ups. The Markers2 binary payload is
# reimplemented from the documented format (vibemix/library/export_serato.py).
# NOTE: mutagen is GPL-2.0-or-later - a runtime dep, lazy-imported and never
# vendored.
serato = [
    "mutagen>=1.47",
]

[project.urls]
Homepage = "https://github.com/ozzaii/vibemix"
Repository = "https://github.com/ozzaii/vibemix"
Issues = "https://github.com/ozzaii/vibemix/issues"

[tool.uv]
# Phase 25 Plan 25-01: pyrekordbox 0.4.4 lists sqlcipher3-wheels as a hard
# install_requires. v2.0 ships XML import path only (CONTEXT D-01 +
# LIBRARY-07 — SQLCipher path UNUSED). Override the transitive with a
# never-matching marker so uv keeps it in the resolved graph (no resolver
# error) but skips it at install time on every real platform. Saves ~3.2 MB
# in the PyInstaller bundle and excludes a C-extension we never execute.
# Verdict + dormancy proof: WAVE-0-DEPS-SPIKE.md.
override-dependencies = [
    "sqlcipher3-wheels; sys_platform == 'never_real_platform_vbm25'",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.0",
    "pytest-mock>=3.15.1",
    # Phase 11 Wave 1: PyInstaller bundles the Python sidecar into a
    # ``--onedir`` package for Tauri's ``externalBin`` to spawn. Dev-only —
    # the shipped binary never executes pyinstaller itself.
    "pyinstaller==6.20.0",
    # Phase 19 Plan 19-01: PyYAML is the loader for .github/repo-config.yml
    # in tests/repo/test_repo_metadata.py + scripts/dist/configure_repo.sh
    # (consumed via `yq` on the shell side; YAML parse on the Python side).
    "pyyaml>=6.0",
    # Phase 27 Plan 27-01 (declared here for Plan 27-02 judges):
    # VCR.py + pytest-recording cache Gemini API calls so PR CI runs at $0.
    # Plan 27-02 uses cassettes under tests/eval/cassettes/ for the 2-judge
    # cross-check tests. Declared in this plan so the manifest is set once.
    "vcrpy>=8.0",
    "pytest-recording>=0.13",
    # Phase 27 Plan 27-07 (LATENCY-14): comtypes is the COM bridge for
    # IMMNotificationClient::OnDefaultDeviceChanged subscription on Windows.
    # sys_platform marker keeps it Windows-only — macOS dev box never sees
    # it (Pitfall P69 carry: never declare a Windows-only dep without the
    # marker, or `uv sync` on macOS fails). Assumption A6: comtypes may be
    # a transitive of pyaudiowpatch; declared explicitly here as defensive
    # default so a future pyaudiowpatch version that drops the dep doesn't
    # silently break LATENCY-14.
    'comtypes>=1.4; sys_platform == "win32"',
    "jinja2>=3.1",
]

# Hatchling includes non-Python files inside a package directory by default
# (unlike setuptools), so package data such as
# ``src/vibemix/state/genre/profiles/*.json`` ships with the wheel
# automatically. File types ignored by git still need narrow .gitignore
# whitelists; the Learn exemplar ``*.wav`` bank is explicitly unignored there
# and verified with ``uv build --wheel``.
[tool.hatch.build.targets.wheel]
packages = ["src/vibemix"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "RUF"]
ignore = [
    "E501",
    # Project docs/prompts intentionally use Turkish text, sigma notation, and
    # DJ math glyphs in comments/docstrings. Keep ruff focused on executable
    # risk rather than rewriting copy.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"cohost*.py" = ["E", "F", "B", "I", "UP", "RUF"]
# Phase 19-01: _test_*.py scratch files deleted (CONTEXT Area 5); ignore
# rule removed to keep the config truthful to repo state.
"test_voice.py" = ["E", "F", "B", "I", "UP", "RUF"]
"generate_bat.py" = ["E", "F", "B", "I", "UP", "RUF"]
"src/vibemix/ui_bus/__init__.py" = ["RUF022"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "macos_audio: requires BlackHole 2ch present (opt-in smoke test, Plan 05)",
    "windows_only: requires sys.platform == 'win32' — live tests for the Windows port (Phase 7 Wave 3+, executed in Phase 20 CI matrix)",
    "integration: end-to-end integration tests that spin up real WS servers / clients (Plan 13-08+)",
    "slow: 60-min soak test; runs only via `pytest -m slow` (Phase 15 Plan 06)",
    "parity: Mac/Win bit-identity gate for the library backend (Phase 28 Plan 02 P55 mitigation)",
    "cli: subprocess CLI integration tests (slower than unit tests; run via `pytest -m cli` for full coverage)",
    "e2e: end-to-end debrief lifecycle tests (Phase 29 Plan 08; opt-in via `pytest -m e2e`)",
    "network: live-network smoke tests (e.g. LAUNCH-06 GitHub org poller); opt-in via `pytest -m network`",
    "real_model_status: bypass patched model-status fixtures to exercise local asset validation directly",
    "flaky: quarantined non-deterministic test; carries a # issue: https://... link enforced by tests/repo/test_no_silent_flakes.py",
]
