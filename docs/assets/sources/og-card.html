<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!--
  docs/assets/sources/og-card.html — OG/social card render source (GH-03).

  Phase 70 Plan 70P02 (Wave 1). This is a HEADLESS-RENDER SOURCE TEMPLATE, NOT a
  responsive page: the root .card is a FIXED 1200×630px canvas (the exact OG
  dimensions). scripts/regenerate_assets.sh screenshots it at viewport 1200×630,
  scale factor 1, producing docs/assets/og-card.png — pinned by SHA-256 in
  docs/assets/MANIFEST.yaml and checked by the asset-bitrot CI gate.

  Aesthetic: CDJ Whisper, lifted VERBATIM from mocks/vibemix-direction-final.html
  (the palette + fonts source-of-truth) — the void stack, the cinematic vignette,
  the two-layer feTurbulence film-grain. 20/80 rule holds at card scale: ~80%
  warm-black/silk, the single amber accent (#ff8a3d) is ONE element — the brand
  LED dot + one amber word in the pitch. The rejected-font families (the serif
  display + the geometric sans + the generic UI sans the anti-backsliding grep
  forbids) appear NOWHERE — only Saira + JetBrains Mono.
  Tailwind is permitted inside this card source per UI-SPEC (it is a render
  template, not the landing) — but here we hand-author the CSS to keep the render
  byte-stable and dependency-free (no CDN fetch beyond Google Fonts).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vibemix — OG card</title>

<!-- Fonts loaded exactly as the mock does (Saira display/body + JetBrains Mono numerals). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@75..125,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ──────────────────────────────────────────────────────────────────────────
   CDJ WHISPER tokens — lifted VERBATIM from mocks/vibemix-direction-final.html.
   ────────────────────────────────────────────────────────────────────────── */
:root {
  /* Void stack */
  --void:    #000000;
  --void-1:  #020205;
  --void-2:  #05070b;
  --void-3:  #0a0c12;
  --void-4:  #11141c;

  /* Silk text */
  --silk:     #d6cfc7;
  --silk-65:  rgba(214, 207, 199, 0.65);
  --silk-40:  rgba(214, 207, 199, 0.40);

  /* Amber — primary deck-light accent (#ff8a3d) */
  --amber:       #ff8a3d;
  --amber-deep:  #ff5a1a;
  --amber-pale:  #ffb88a;
  --amber-22:    rgba(255, 138, 61, 0.22);
  --amber-40:    rgba(255, 138, 61, 0.40);
  --amber-65:    rgba(255, 138, 61, 0.65);

  /* Night-rave ambients — body atmospheric only (verbatim from mock) */
  --rave-magenta: rgba(192, 56, 224, 0.055);
  --rave-pink:    rgba(255, 92, 188, 0.038);
  --rave-cyan:    rgba(72, 152, 255, 0.042);
  --rave-purple:  rgba(118, 56, 224, 0.030);
  --rave-teal:    rgba(64, 220, 200, 0.022);

  /* Type — Saira (display/body) + JetBrains Mono (labels). No second sans needed:
     the variable Saira axis carries 400→800; deliberate weight set documented inline. */
  --type-display: 'Saira', system-ui, sans-serif;
  --type-mono:    'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: #000;
  width: 1200px;
  height: 630px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* The card is a FIXED 1200×630 canvas — NOT responsive. */
.card {
  position: relative;
  width: 1200px;
  height: 630px;
  color: var(--silk);
  font-family: var(--type-display);
  overflow: hidden;

  /* Cinematic vignette + restrained rave washes + deep blue undertone —
     lifted VERBATIM from the mock's body background. */
  background-image:
    radial-gradient(ellipse 92% 78% at 50% 45%, transparent 0%, rgba(0,0,0,0.5) 75%, rgba(0,0,0,0.9) 100%),
    radial-gradient(ellipse 55% 38% at 18% 22%, var(--rave-magenta), transparent 60%),
    radial-gradient(ellipse 48% 36% at 84% 78%, var(--rave-cyan),    transparent 55%),
    radial-gradient(ellipse 60% 42% at 55% 105%, var(--rave-pink),   transparent 60%),
    radial-gradient(ellipse 35% 28% at 92% 12%, var(--rave-purple),  transparent 55%),
    radial-gradient(ellipse 28% 22% at 5% 88%,  var(--rave-teal),    transparent 55%),
    linear-gradient(180deg, #02030a 0%, #000000 55%, #030208 100%);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
}

/* MULTI-LAYER FILM TEXTURE — coarser dust + fine grain, lifted VERBATIM from
   the mock's body::before (two feTurbulence data-URIs, overlay blend). */
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='d'><feTurbulence type='fractalNoise' baseFrequency='0.42' numOctaves='3' seed='9'/></filter><rect width='100%25' height='100%25' filter='url(%23d)' opacity='0.022'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='280'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='2' seed='5'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.028'/></svg>");
  pointer-events: none;
  mix-blend-mode: overlay;
  z-index: 1;
}

.stack { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 0 80px; text-align: center; }

/* Eyebrow: the single JetBrains-Mono micro-label + the brand LED dot. */
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-family: var(--type-mono);
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 0.30em;
  text-transform: uppercase;
  color: var(--silk-40);
}

/* The SINGLE amber accent element #1 — the brand LED dot (hardware-dome
   treatment from the mock). Static (this is a still render). */
.led {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--amber);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.3),
    0 0 6px var(--amber),
    0 0 14px var(--amber-40);
}

/* Wordmark — Saira condensed-heavy. Deliberate weight set (frontend-enforcement
   rule 5): wdth 82 + wght 700 matches the mock's wordmark axis exactly; the
   variable Saira axis gives display weight from the single family, no second
   face. Large (148px) because the canvas is a FIXED 1200×630 — sized to read
   at a ~360px Slack/Discord/Twitter unfurl thumbnail. */
.wordmark {
  font-family: var(--type-display);
  font-variation-settings: "wdth" 82, "wght" 700;
  font-size: 148px;
  line-height: 0.9;
  letter-spacing: -0.02em;
  text-transform: lowercase;
  color: var(--silk);
}

/* The one-line pitch — Saira wght 400, silk-65, ≥28px on the 1200-wide canvas.
   The single amber WORD ("listens") is amber accent element #2 — 20/80 holds:
   amber is ~one word, not a wash. */
.pitch {
  font-family: var(--type-display);
  font-variation-settings: "wdth" 100, "wght" 400;
  font-size: 38px;
  line-height: 1.25;
  color: var(--silk-65);
  max-width: 1000px;
}
.pitch .amber {
  color: var(--amber);
  font-variation-settings: "wdth" 100, "wght" 600;
  text-shadow: 0 0 10px var(--amber-40), 0 0 22px var(--amber-22);
}
</style>
</head>
<body>
  <div class="card">
    <div class="stack">
      <div class="eyebrow">
        <span class="led" aria-hidden="true"></span>
        OPEN SOURCE · MAC + WIN
      </div>
      <div class="wordmark">vibemix</div>
      <div class="pitch">the only AI co-host that actually <span class="amber">listens</span> to your set</div>
    </div>
  </div>
</body>
</html>
